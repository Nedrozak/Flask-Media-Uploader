services:
  tailscale:
    container_name: media-uploader-tailscale
    build:
      context: ../..
      dockerfile: deploy/tailscale-funnel/Tailscale.Dockerfile
    image: media-uploader-tailscale:local
    restart: unless-stopped
    hostname: ${TAILSCALE_HOSTNAME:-media-uploader}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME:-media-uploader}
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    volumes:
      - "${MEDIA_UPLOADER_TAILSCALE_DIR:-F:/docker/media-uploader/tailscale}:/var/lib/tailscale"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - egress
      - backend

  web:
    container_name: media-uploader-web
    build:
      context: ../..
      dockerfile: Dockerfile
    image: media-uploader:local
    restart: unless-stopped
    network_mode: service:tailscale
    environment:
      PORT: "5000"
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in Portainer}
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
      UPLOAD_FOLDER: /app/uploads
      AUDIT_LOG_PATH: /app/audit/audit.jsonl
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-14}
      SESSION_COOKIE_SECURE: "true"
      HSTS_MAX_AGE: "31536000"
      TRUSTED_HOSTS: ${FUNNEL_HOST:?Set FUNNEL_HOST to the exact media-uploader.<tailnet>.ts.net hostname}
      PROXY_FIX_X_FOR: "1"
      PROXY_FIX_X_PROTO: "1"
      PROXY_FIX_X_HOST: "1"
      UPLOAD_AUTH_ENABLED: "true"
      UPLOAD_AUTH_USERNAME: ${UPLOAD_AUTH_USERNAME:-uploader}
      UPLOAD_AUTH_PASSWORD_HASH: ${UPLOAD_AUTH_PASSWORD_HASH:?Set UPLOAD_AUTH_PASSWORD_HASH in Portainer}
      MIN_FREE_DISK_BYTES: ${MIN_FREE_DISK_BYTES:-10737418240}
      TOKEN_EXPIRY_SECONDS: ${TOKEN_EXPIRY_SECONDS:-21600}
      ADMIN_ENABLED: ${ADMIN_ENABLED:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
    depends_on:
      tailscale:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - "${MEDIA_UPLOADER_UPLOADS_DIR:-D:/MediaUploader/data}:/app/uploads"
      - "${MEDIA_UPLOADER_AUDIT_DIR:-F:/docker/media-uploader/audit}:/app/audit"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

  cleanup:
    container_name: media-uploader-cleanup
    build:
      context: ../..
      dockerfile: Dockerfile
    image: media-uploader:local
    restart: unless-stopped
    command: ["media-uploader-cleanup"]
    healthcheck:
      disable: true
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in Portainer}
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
      UPLOAD_FOLDER: /app/uploads
      AUDIT_LOG_PATH: ""
      MIN_FREE_DISK_BYTES: ${MIN_FREE_DISK_BYTES:-10737418240}
      TOKEN_EXPIRY_SECONDS: ${TOKEN_EXPIRY_SECONDS:-21600}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - "${MEDIA_UPLOADER_UPLOADS_DIR:-D:/MediaUploader/data}:/app/uploads"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"
    networks:
      - backend

  redis:
    container_name: media-uploader-redis
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - "${MEDIA_UPLOADER_REDIS_DIR:-F:/docker/media-uploader/redis}:/data"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"
    networks:
      - backend

networks:
  egress:
    name: media-uploader-egress
    driver: bridge
  backend:
    name: media-uploader-backend
    driver: bridge
    internal: true
