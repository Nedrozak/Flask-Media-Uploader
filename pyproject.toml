[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-uploader"
version = "0.2.0"
description = "A Redis-backed Flask application for expiring, chunked image and video shares."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Media Uploader contributors" }]
dependencies = [
  "boto3>=1.43,<2",
  "click>=8.3.3,<9",
  "Flask>=3.1.3,<4",
  "Flask-WTF>=1.3,<2",
  "Werkzeug>=3.1.8,<4",
  "python-dotenv>=1.2.2,<2",
  "python-magic>=0.4.27,<1",
  "redis>=8.1,<9",
  "waitress>=3,<4",
]

[project.scripts]
media-uploader = "media_uploader.server:main"
media-uploader-cleanup = "media_uploader.cleanup_worker:main"
media-uploader-admin-hash = "media_uploader.admin_cli:main"

[dependency-groups]
dev = [
  "fakeredis>=2.36.2,<3",
  "mypy>=1.17,<2",
  "packaging>=25,<27",
  "pip-audit>=2.7,<3",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "types-waitress>=3.0.1.20260724,<4",
]

e2e = [
  "playwright>=1.54,<2",
  "pytest>=8,<10",
  "pytest-playwright>=0.7,<1",
]

[tool.setuptools.packages.find]
include = ["media_uploader*"]

[tool.setuptools.package-data]
media_uploader = ["templates/*.jinja", "static/css/*", "static/scripts/*", "static/favicon/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
